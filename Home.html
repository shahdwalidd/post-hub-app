<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Hub</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="home.css">
  <!-- Axios -->
  <script src="./node_modules/axios/dist/axios.min.js"></script>
</head>

<body>
  <!-- modal -->
   <!-- login modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="false">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">LOGIN</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label for="recipient-name" class="col-form-label">Username:</label>
            <input type="text" class="form-control" id="username-input">
          </div>
          <div class="mb-3">
            <label for="message-text" class="col-form-label">Password:</label>
          <input type="password" class="form-control" id="password-input">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" onclick="buttonLoginClick()">login</button>
      </div>
    </div>
  </div>
</div>
  <!-- Navbar -->
  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <ul class="nav nav-pills mb-0">
        <li class="nav-item">
          <a class="nav-link active" href="#">PostHub</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Profile</a>
        </li>
      </ul>
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">Login</button>
        <button type="button" class="btn btn-outline-secondary">Register</button>
      </div>
    </div>
  </div>

  <!-- Hero Section -->
  <div class="hero-section d-flex flex-column justify-content-center align-items-center text-center">
    <h1>Welcome to Post Hub</h1>
    <p>Connect, share posts, comment, and enjoy your social space.</p>
    <div class="mt-3">
      <button class="btn btn-primary me-2">Get Started</button>
      <button class="btn btn-outline-light">Learn More</button>
    </div>
  </div>

  <!-- Posts Container -->
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6" id="posts">
        
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Home JS -->
  <script src="home.js"></script>
</body>

</html>
