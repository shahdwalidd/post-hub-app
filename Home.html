<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Hub</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="home.css">
  <!-- Axios -->
  <script src="./node_modules/axios/dist/axios.min.js"></script>
</head>

<body>
  <!-- Alerts -->
  <div id="alerts" class="position-fixed top-0 end-0 m-3"></div>

  <!-- Navbar -->
  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <ul class="nav nav-pills mb-0">
        <li class="nav-item"><a class="nav-link active" href="#">PostHub</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Profile</a></li>
      </ul>

      <span id="userprofile">
        <img src="./images/imgprofile.png" alt="Profile Image">
        <span class="username">Shahd Walid</span>
      </span>

      <div id="logged-out-div" class="d-flex gap-2">
        <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal"
          data-bs-target="#login-modal">Login</button>
        <button type="button" class="btn btn-outline-secondary" data-bs-toggle="modal"
          data-bs-target="#register-modal">Register</button>
      </div>

      <div id="logout-div" class="d-flex gap-2" style="display:none;">
        <button onclick="logout()" class="btn btn-outline-secondary">Logout</button>
      </div>

    </div>
  </div>

  <!-- Hero Section -->
  <div class="hero-section d-flex flex-column justify-content-center align-items-center text-center my-4">
    <h1>Welcome to Post Hub</h1>
    <p>Connect, share posts, comment, and enjoy your social space.</p>
  </div>

  <!-- Posts Container -->
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6" id="posts"></div>
    </div>
  </div>

  <!-- Add Post Button -->
  <div class="text-center mb-4">
    <button id="addbutton" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#add-modal"
      aria-label="Add Post">
      <i class="bi bi-plus-circle-fill"></i> Add Post
    </button>
  </div>

  <!-- Add Post Modal -->
  <div class="modal fade" id="add-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Add Post</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <input type="text" id="post-title" placeholder="Post Title" class="form-control mb-2">
          <textarea id="post-body" placeholder="Post Body" class="form-control mb-2"></textarea>
          <input type="file" id="post-image" accept="image/*" class="form-control mb-2">
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary" onclick=" addNewPostUser()">Add Post</button>
        </div>

      </div>
    </div>
  </div>

  <!-- Login Modal -->
  <div class="modal fade" id="login-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Login</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="username-input" class="form-label">Username</label>
            <input type="text" class="form-control" id="username-input">
          </div>
          <div class="mb-3">
            <label for="password-input" class="form-label">Password</label>
            <input type="password" class="form-control" id="password-input">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary" onclick="buttonLoginClick()">Login</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Register Modal -->
  <div class="modal fade" id="register-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Register</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="register-username-input" class="form-label">Username</label>
            <input type="text" class="form-control" id="register-username-input">
          </div>
          <div class="mb-3">
            <label for="register-name-input" class="form-label">Name</label>
            <input type="text" class="form-control" id="register-name-input">
          </div>
          <div class="mb-3">
            <label for="register-password-input" class="form-label">Password</label>
            <input type="password" class="form-control" id="register-password-input">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary" onclick="buttonRegisterClick()">Register</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Home JS -->
  <script src="home.js" defer></script>

</body>

</html>
